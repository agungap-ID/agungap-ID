<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      /* Background Pulse */
      .bg {
        fill: #0D1117;
      }

      /* Aura Glow Pulse */
      .aura {
        transform-origin: 300px 300px;
        animation: aura-pulse 1.2s infinite alternate ease-in-out;
      }

      @keyframes aura-pulse {
        0% { transform: scale(0.95); opacity: 0.4; }
        100% { transform: scale(1.15); opacity: 0.85; }
      }

      /* Lightning / Energy Rays */
      .lightning {
        transform-origin: 300px 300px;
        animation: lightning-spin 2s infinite linear;
      }

      @keyframes lightning-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Saitama Floating Motion */
      .saitama {
        transform-origin: 300px 300px;
        animation: float 2.5s infinite alternate ease-in-out;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }

      /* Punching Fist Tremble */
      .fist {
        transform-origin: 240px 330px;
        animation: punch-tremble 0.15s infinite alternate;
      }

      @keyframes punch-tremble {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(4px, -4px) scale(1.03); }
      }

      /* Eye Glint Flash */
      .eye-glint {
        animation: eye-flash 0.8s infinite alternate;
      }

      @keyframes eye-flash {
        0% { opacity: 0.2; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.3); }
      }

      /* Shockwave Expand */
      .shockwave {
        transform-origin: 240px 330px;
        animation: shockwave-expand 1.5s infinite linear;
      }

      @keyframes shockwave-expand {
        0% { transform: scale(0.2); opacity: 1; stroke-width: 8; }
        100% { transform: scale(2.2); opacity: 0; stroke-width: 1; }
      }
    </style>

    <!-- Radial Glow Gradient -->
    <radialGradient id="energy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D4D" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F9D342" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Frame -->
  <rect class="bg" width="600" height="600" rx="20" stroke="#30363D" stroke-width="3"/>

  <!-- Energy Aura Background -->
  <circle class="aura" cx="300" cy="300" r="210" fill="url(#energy-glow)"/>

  <!-- Rotating Lightning Speed Lines -->
  <g class="lightning" stroke="#F9D342" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <line x1="300" y1="50" x2="300" y2="110"/>
    <line x1="300" y1="490" x2="300" y2="550"/>
    <line x1="50" y1="300" x2="110" y2="300"/>
    <line x1="490" y1="300" x2="550" y2="300"/>
    <line x1="120" y1="120" x2="160" y2="160"/>
    <line x1="440" y1="440" x2="480" y2="480"/>
    <line x1="120" y1="480" x2="160" y2="440"/>
    <line x1="440" y1="120" x2="480" y2="160"/>
  </g>

  <!-- Expanding Impact Shockwaves -->
  <circle class="shockwave" cx="240" cy="330" r="80" fill="none" stroke="#EA2027"/>
  <circle class="shockwave" cx="240" cy="330" r="80" fill="none" stroke="#F9D342" style="animation-delay: 0.75s;"/>

  <!-- Saitama Character Wrapper (Floating Animation) -->
  <g class="saitama">
    <!-- Cape -->
    <path d="M 230 240 Q 140 280 110 420 Q 220 380 270 350 Z" fill="#EAEAEA" stroke="#222" stroke-width="4"/>

    <!-- Hero Yellow Suit Body -->
    <path d="M 240 250 Q 300 240 370 280 L 350 420 Q 280 430 230 380 Z" fill="#F9D342" stroke="#222" stroke-width="5"/>
    <path d="M 280 245 Q 310 270 340 255" fill="none" stroke="#222" stroke-width="5"/>

    <!-- Serious Head -->
    <g transform="translate(40, -10)">
      <!-- Head Oval -->
      <ellipse cx="280" cy="200" rx="55" ry="68" fill="#FFE0BD" stroke="#222" stroke-width="5"/>
      
      <!-- Head Highlight -->
      <path d="M 255 145 Q 280 138 300 145" fill="none" stroke="#FFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

      <!-- Intense Eyebrows -->
      <polygon points="245,180 275,192 272,197 243,185" fill="#222"/>
      <polygon points="315,180 285,192 288,197 317,185" fill="#222"/>

      <!-- Eyes -->
      <polygon points="248,193 270,197 253,205" fill="#FFF" stroke="#222" stroke-width="2"/>
      <circle cx="260" cy="198" r="3" fill="#222"/>

      <polygon points="312,193 290,197 307,205" fill="#FFF" stroke="#222" stroke-width="2"/>
      <circle cx="300" cy="198" r="3" fill="#222"/>

      <!-- Glowing Red Eye Lens Effect -->
      <circle class="eye-glint" cx="260" cy="198" r="4" fill="#EA2027" filter="url(#glow)"/>
      <circle class="eye-glint" cx="300" cy="198" r="4" fill="#EA2027" filter="url(#glow)"/>

      <!-- Clenched Mouth -->
      <rect x="262" y="228" width="36" height="10" rx="3" fill="#FFF" stroke="#222" stroke-width="3"/>
      <line x1="280" y1="228" x2="280" y2="238" stroke="#222" stroke-width="2"/>
    </g>

    <!-- Trembling Serious Punch Fist -->
    <g class="fist" filter="url(#glow)">
      <!-- Red Glove -->
      <path d="M 170 330 C 170 290, 210 270, 250 280 C 280 290, 290 320, 280 350 C 270 380, 220 400, 180 380 C 170 370, 170 350, 170 330 Z" fill="#EA2027" stroke="#FFF" stroke-width="4"/>
      <!-- Knuckle Creases -->
      <line x1="210" y1="295" x2="215" y2="340" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="235" y1="295" x2="240" y2="345" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="258" y1="305" x2="260" y2="345" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title Badge (Bottom Overlay) -->
  <rect x="180" y="520" width="240" height="42" rx="10" fill="#161B22" stroke="#EA2027" stroke-width="2"/>
  <text x="300" y="547" font-family="'Consolas', 'Courier New', monospace" font-size="16" font-weight="900" fill="#F9D342" text-anchor="middle" letter-spacing="1">
    SERIOUS_PUNCH.EXE
  </text>
</svg>
